  <!-- ============ SEARCH ============ -->
  <sc-if value="{{ isSearch }}" hint-placeholder-val="{{ false }}">
  <main style="max-width:1180px;margin:0 auto;padding:26px 22px 80px;display:grid;grid-template-columns:230px 1fr;gap:28px">
    <aside style="align-self:start;position:sticky;top:82px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)">Фільтри</span>
        <button onClick="{{ onClearFacets }}" style="font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer">Скинути</button>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:0 0 8px">Тип</div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:20px">
        <sc-for list="{{ kindFacets }}" as="f" hint-placeholder-count="6">
          <button onClick="{{ f.onToggle }}" style="display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;background:{{ f.bg }};border:none;cursor:pointer;color:var(--text);text-align:left" style-hover="background:var(--bg-hover)">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--kind-{{ f.kind }})"></span>
            <span style="flex:1;text-transform:capitalize;font-size:13px">{{ f.label }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint)">{{ f.count }}</span>
          </button>
        </sc-for>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:0 0 8px">Keywords</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
        <sc-for list="{{ keywordFacets }}" as="k" hint-placeholder-count="8">
          <button onClick="{{ k.onToggle }}" style="padding:3px 9px;border-radius:20px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;background:{{ k.bg }};border:1px solid {{ k.bd }};color:{{ k.fg }}">{{ k.label }}</button>
        </sc-for>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:0 0 8px">Автор</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ authorFacets }}" as="a" hint-placeholder-count="4">
          <button onClick="{{ a.onToggle }}" style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:7px;background:{{ a.bg }};border:none;cursor:pointer;color:var(--text);text-align:left;font-size:13px" style-hover="background:var(--bg-hover)">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ a.label }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);flex-shrink:0">{{ a.count }}</span>
          </button>
        </sc-for>
      </div>
    </aside>

    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px">
        <div>
          <h1 style="font-size:20px;font-weight:600;margin:0 0 3px">{{ searchHeading }}</h1>
          <div style="font-size:13px;color:var(--text-dim)">{{ resultCountLabel }}</div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim)">Сортувати
          <select value="{{ sort }}" onChange="{{ onSort }}" style="height:32px;padding:0 8px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none">
            <option value="relevance">За релевантністю</option>
            <option value="name">За назвою</option>
            <option value="updated">Нещодавно оновлені</option>
          </select>
        </label>
      </div>

      <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">
        <sc-for list="{{ results }}" as="card" hint-placeholder-count="6">
          <div style="display:flex;flex-direction:column;background:var(--bg-elev);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:border-color .15s" style-hover="border-color:var(--border-strong)">
            <div style="padding:15px 16px 12px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;text-transform:capitalize;color:var(--kind-{{ card.kind }});background:color-mix(in oklab, var(--kind-{{ card.kind }}) 15%, transparent)">{{ card.kind }}</span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint)">{{ card.version }}</span>
              </div>
              <div onClick="{{ card.onOpen }}" style="font-size:15px;font-weight:600;cursor:pointer;letter-spacing:-.01em">{{ card.displayName }}</div>
              <p style="font-size:13px;color:var(--text-dim);margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px">{{ card.description }}</p>
              <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:11px">
                <sc-for list="{{ card.keywordsShown }}" as="kw" hint-placeholder-count="3">
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint)">#{{ kw }}</span>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:color-mix(in oklab, var(--bg-elev2) 60%, var(--bg))">
              <span style="font-size:12px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ card.metaLabel }}</span>
              <div style="display:flex;gap:6px;flex-shrink:0">
                <button onClick="{{ card.onCopy }}" style="height:28px;padding:0 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:{{ card.copyColor }};cursor:pointer;font-size:12px;font-weight:500">{{ card.copyLabel }}</button>
                <button onClick="{{ card.onOpen }}" style="height:28px;padding:0 12px;background:var(--accent);border:none;border-radius:7px;color:var(--accent-fg);cursor:pointer;font-size:12px;font-weight:600">Відкрити</button>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
      </sc-if>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:70px 20px;border:1px dashed var(--border-strong);border-radius:14px">
          <div style="font-size:30px;margin-bottom:8px">🔍</div>
          <h3 style="margin:0 0 6px">Нічого не знайшли</h3>
          <p style="color:var(--text-dim);margin:0 0 16px">Спробуйте скинути фільтри або змінити запит.</p>
          <button onClick="{{ onClearFacets }}" style="height:34px;padding:0 16px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer">Скинути фільтри</button>
        </div>
      </sc-if>
    </section>
  </main>
  </sc-if>
