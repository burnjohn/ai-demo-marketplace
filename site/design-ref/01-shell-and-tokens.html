<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: color-mix(in oklab, var(--accent) 40%, transparent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input, button, select { font-family: inherit; }
  .app { --bg:#0b0c0f; --bg-elev:#101217; --bg-elev2:#161920; --bg-hover:#1c2029; --border:#23262f; --border-strong:#33384380; --text:#e8eaef; --text-dim:#98a0ae; --text-faint:#5f6672; --accent:oklch(0.68 0.15 255); --accent-fg:#fff;
    --kind-plugin:oklch(0.72 0.15 255); --kind-skill:oklch(0.74 0.14 158); --kind-agent:oklch(0.72 0.15 305); --kind-command:oklch(0.76 0.14 55); --kind-hook:oklch(0.78 0.14 115); --kind-mcp:oklch(0.7 0.16 20); }
  .app[data-theme="light"] { --bg:#f6f7f9; --bg-elev:#ffffff; --bg-elev2:#ffffff; --bg-hover:#eef0f4; --border:#e2e5ea; --border-strong:#c9cdd6; --text:#161a20; --text-dim:#5a626e; --text-faint:#8b93a0; --accent:oklch(0.55 0.17 255); --accent-fg:#fff;
    --kind-plugin:oklch(0.52 0.16 255); --kind-skill:oklch(0.5 0.14 158); --kind-agent:oklch(0.52 0.16 305); --kind-command:oklch(0.55 0.15 55); --kind-hook:oklch(0.52 0.14 132); --kind-mcp:oklch(0.53 0.18 20); }
  .app[data-accent="green"]  { --accent:oklch(0.7 0.14 158); } .app[data-accent="green"][data-theme="light"]{ --accent:oklch(0.5 0.14 158);}
  .app[data-accent="violet"] { --accent:oklch(0.68 0.16 305);} .app[data-accent="violet"][data-theme="light"]{ --accent:oklch(0.53 0.17 305);}
  .app[data-accent="amber"]  { --accent:oklch(0.76 0.14 65);} .app[data-accent="amber"][data-theme="light"]{ --accent:oklch(0.6 0.15 60);}
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<div class="app" data-theme="{{ theme }}" data-accent="{{ accent }}" style="min-height:100vh;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5">

  <header style="position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:58px;padding:0 22px;background:color-mix(in oklab, var(--bg-elev) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)">
    <div onClick="{{ goHome }}" style="display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0">
      <div style="width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-fg);font-weight:700;font-size:14px;font-family:'IBM Plex Mono',monospace">◆</div>
      <span style="font-weight:600;letter-spacing:-.01em">Каталог</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);border:1px solid var(--border);padding:1px 6px;border-radius:5px">dev-digest</span>
    </div>
    <div style="position:relative;flex:1;max-width:520px">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px">⌕</span>
      <input value="{{ query }}" onInput="{{ onGlobalInput }}" onKeyDown="{{ onGlobalKey }}" placeholder="Пошук по каталогу…" style="width:100%;height:36px;padding:0 12px 0 32px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);outline:none;font-size:13px" />
    </div>
    <button onClick="{{ onOpenPalette }}" style="display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace">⌘K</button>
    <button onClick="{{ onToggleTheme }}" style="width:34px;height:34px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:14px">{{ themeIcon }}</button>
    <a href="{{ repoUrl }}" target="_blank" style="color:var(--text-dim);font-size:12px;padding:0 4px">GitHub ↗</a>
  </header>
